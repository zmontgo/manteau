[workspace]
resolver = "3"
members = ["manteau-http", "manteau-render", "manteau", "manteau-core", "manteau-macros", "manteau-mailjet", "manteau-cloudflare", "manteau-jetemail", "manteau-mock", "manteau-stdout"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Zachary Montgomery"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zmontgo/manteau"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
manteau-http = { version = "=0.2.0", path = "manteau-http", default-features = false }
manteau-render = { version = "=0.2.0", path = "manteau-render" }
manteau = { version = "=0.2.0", path = "manteau" }
manteau-core = { version = "=0.2.0", path = "manteau-core" }
manteau-macros = { version = "=0.2.0", path = "manteau-macros" }
manteau-mailjet = { version = "=0.2.0", path = "manteau-mailjet" }
manteau-cloudflare = { version = "=0.2.0", path = "manteau-cloudflare" }
manteau-jetemail = { version = "=0.2.0", path = "manteau-jetemail" }
manteau-mock = { version = "=0.2.0", path = "manteau-mock" }
manteau-stdout = { version = "=0.2.0", path = "manteau-stdout" }
mrml = { version = "6", default-features = false, features = ["parse", "render"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
html2text = "0.16"
validator = "0.20"
askama_escape = "0.10"
url = "2"
reqwest = { version = "0.13", features = ["json"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
