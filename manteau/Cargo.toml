[package]
name = "manteau"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed email templates with independently pluggable delivery providers."
readme = "README.md"
keywords = ["email", "mjml", "transactional"]
categories = ["email", "template-engine"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["tls-rustls", "render-mrml"]
render-mrml = ["dep:manteau-render"]
mailjet = ["dep:manteau-mailjet", "dep:manteau-http"]
cloudflare = ["dep:manteau-cloudflare", "dep:manteau-http"]
jetemail = ["dep:manteau-jetemail", "dep:manteau-http"]
mock = ["dep:manteau-mock"]
stdout = ["dep:manteau-stdout"]
tls-rustls = ["manteau-http?/tls-rustls"]
tls-native = ["manteau-http?/tls-native"]

[dependencies]
manteau-http = { workspace = true, optional = true }
manteau-render = { workspace = true, optional = true }
manteau-core.workspace = true
manteau-macros.workspace = true
manteau-mailjet = { workspace = true, optional = true }
manteau-cloudflare = { workspace = true, optional = true }
manteau-jetemail = { workspace = true, optional = true }
manteau-mock = { workspace = true, optional = true }
manteau-stdout = { workspace = true, optional = true }

[dev-dependencies]
tracing.workspace = true
manteau-mock.workspace = true
tokio.workspace = true
tracing-subscriber = "0.3"
serde_json.workspace = true
