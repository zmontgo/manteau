[package]
name        = "manteau"
version     = "0.1.0"
edition     = "2024"
authors     = ["the manteau contributors"]
license     = "MIT OR Apache-2.0"
description = "Typed builders for MJML emails with pluggable transports (Mailjet, stdout, mock)."
repository  = "https://github.com/USER/manteau"
readme      = "README.md"
keywords    = ["email", "mjml", "mailjet", "template", "transactional"]
categories  = ["email", "template-engine"]

[features]
default    = []
mailjet    = ["dep:reqwest", "dep:serde_json", "tls-rustls"]
stdout     = []
tls-rustls = ["reqwest/rustls", "reqwest/webpki-roots"]
tls-native = ["reqwest/native-tls"]

[dependencies]
mrml          = "6"
typed-builder = "0.23"
serde         = { version = "1", features = ["derive"] }
async-trait   = "0.1"
thiserror     = "2"
tracing       = "0.1"
html2text     = "0.16"
validator     = "0.20"

reqwest    = { version = "0.13", features = ["json"], default-features = false, optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
