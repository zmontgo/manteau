[workspace]
members = ["manteau-macros"]

[package]
name         = "manteau"
version      = "0.1.7"
edition      = "2024"
rust-version = "1.85"
authors      = ["Zachary Montgomery"]
license      = "MIT OR Apache-2.0"
description  = "Ergonomically build and send emails with Rust, using one of our supported providers or providing your own."
repository   = "https://github.com/zmontgo/manteau"
readme       = "README.md"
keywords     = ["email", "mjml", "mailjet", "template", "transactional"]
categories   = ["email", "template-engine"]
exclude      = [
    "AGENTS.md",
    "rustfmt.toml",
    ".github/",
    ".claude/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default    = []
cloudflare = ["dep:reqwest", "dep:serde_json", "tls-rustls"]
mailjet    = ["dep:reqwest", "dep:serde_json", "tls-rustls"]
stdout     = []
tls-rustls = ["reqwest/rustls"]
tls-native = ["reqwest/native-tls"]

[dependencies]
mrml           = "6"
serde          = { version = "1", features = ["derive"] }
async-trait    = "0.1"
thiserror      = "2"
tracing        = "0.1"
html2text      = "0.16"
validator      = "0.20"
askama_escape  = "0.10"
manteau-macros = { version = "=0.1.5", path = "manteau-macros" }

reqwest    = { version = "0.13", features = ["json"], default-features = false, optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio              = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3"
wiremock           = "0.6"

[[test]]
name             = "cloudflare"
required-features = ["cloudflare"]

[[test]]
name             = "mailjet"
required-features = ["mailjet"]

[[example]]
name             = "welcome"
required-features = ["stdout"]

[[example]]
name = "newsletter"

[[example]]
name = "builder"
