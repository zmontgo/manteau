[package]
name = "manteau-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural template syntax for Manteau."
readme = "README.md"
keywords = ["email", "mjml", "transactional"]
categories = ["email", "template-engine"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut"] }
proc-macro-crate = "3"
manteau-core.workspace = true
